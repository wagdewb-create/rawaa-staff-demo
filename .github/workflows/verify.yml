name: RAWAA staff checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check staff.js
          node --check work-vault.js
          node --check cloud-sync.js
          node --check daily-batch.js
          node --check weekly-report.js
          node --check easy-ui.js
      - name: Verify payroll and staff
        run: |
          node tests/payroll-unit.cjs
          node tests/bulk-staff.cjs
          node tests/staff-rename.cjs
      - name: Verify encrypted one-device work mode
        run: node tests/work-vault.cjs
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1
      - name: Test encrypted iPhone-compatible work flow in Chromium
        run: |
          node tests/easy-ui.cjs
          node tests/work-browser.cjs
          node tests/cloud-browser.cjs
          node tests/transfer-recovery.cjs
      - name: Test iPhone first-party authentication gateway
        run: node tests/first-party.cjs
      - name: Check live Neon Auth loading (no test account created)
        run: node tests/cloud-live-sdk.cjs
